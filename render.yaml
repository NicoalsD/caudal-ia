services:
  - type: web
    name: caudal-ia
    runtime: docker
    repo: https://github.com/NicoalsD/caudal-ia
    branch: develop
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /v1/health
    autoDeployTrigger: "off"
    envVars:
      - key: IA_SERVICE_TOKEN
        sync: false
      - key: PORT
        value: "10000"
      - key: SERIES_TIMEZONE
        value: America/Bogota
      - key: LOG_LEVEL
        value: INFO
      - key: API_DOCS_ENABLED
        value: "true"
      - key: LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_S
        value: "15"
      - key: LLM_MAX_RETRIES
        value: "1"
